name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run of a branch, or of a pull request, cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --features tree
      - run: cargo test --features alloc
      - run: cargo test

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # The oldest versions that the manifest allows: serde_json 1.0.154 is the first that
  # builds on `serde_core` with `alloc` alone.
  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo test --all-features --locked

  # 32 bits, where a `usize` holds less than a `u64`.
  i686:
    name: Tests on 32 bits (i686-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --target i686-unknown-linux-musl

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target thumbv7em-none-eabihf
      - run: cargo build --lib --target thumbv7em-none-eabihf --features alloc
      - run: cargo build --lib --target thumbv7em-none-eabihf --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --features alloc -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      # The benchmarks of the README, a package of their own.
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # Without a feature, as a workspace that has the crate as a member documents it.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --features alloc
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # What ships builds on its own, and nothing else ships.
      - run: cargo package --all-features
      - run: "! cargo package --list | grep -E '^(fuzz|benches|readme|\\.github)/'"

  fuzz:
    name: Fuzz the identities, the paths and the forms of a tree (3 minutes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run identity -- -max_total_time=60 -max_len=64 -dict=fuzz/identity.dict
      - run: cargo fuzz run paths -- -max_total_time=60 -max_len=512 -dict=fuzz/paths.dict
      - run: cargo fuzz run forms -- -max_total_time=60 -max_len=512

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The rustfmt of the MSRV: a new stable release must not change what is formatted.
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml

  # The README and the front page of the documentation print what they show: readme/
  # is a package of its own, whose build script writes their blocks.
  readme:
    name: The README blocks print what they show
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: readme
      - run: cargo test --manifest-path readme/Cargo.toml
      - run: cargo clippy --manifest-path readme/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path readme/Cargo.toml
