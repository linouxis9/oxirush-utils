name: Fuzz

# The fuzz targets of fuzz/, longer than the minute that each has at a push: the jobs of
# crate-fuzz.yml of oxirush-aper, which every crate of the family calls. An hour for
# each target every day but Wednesday and Sunday, from 01:33 UTC, one target at a time,
# and four hours for each on Wednesday, one target at a time, less when the fuzzing of a
# run would not end within the eight hours that crate-fuzz.yml gives it; the crates of
# the family fuzz each at an hour of its own, with few jobs at once, and each has a day
# of its own for its long run, so that what they run at once leaves runners to the other
# CI (GitHub starts a scheduled run hours after its time, in their order). The corpus of
# each target is kept from one run to the next in the cache of the repository, and
# grows. On Wednesday, and when `weekly` is set by hand, each corpus is minimized and
# its coverage kept for 30 days. A crash or a timeout fails the job, which keeps the
# input and the log: the input goes into a test with its fix.
on:
  schedule:
    - cron: "33 1 * * 1,2,4-6"
    - cron: "33 1 * * 3"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Wednesday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

# A dispatch gives its minutes as text, which fromJSON makes the number that the called
# workflow takes, as it does the boolean of `weekly`; a schedule gives neither.
jobs:
  fuzz:
    uses: linouxis9/oxirush-aper/.github/workflows/crate-fuzz.yml@7ff6f4df878d24cb90b62059144e728ca30beac2
    with:
      weekly: "33 1 * * 3"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
      # Each target takes the dictionary of what its octets are: the words of the
      # identities, and JSON with the paths of the trees.
      targets: >-
        [{"target": "identity", "max_len": 64, "flags": "-dict=fuzz/identity.dict"},
         {"target": "paths", "max_len": 512, "flags": "-dict=fuzz/paths.dict"},
         {"target": "forms", "max_len": 512}]
