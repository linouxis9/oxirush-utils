[package]
name = "oxirush-utils"
version = "0.1.0"
edition = "2024"
description = "3GPP identities for 5GS and EPS as Rust values (PLMN, IMSI, IMEI, SUPI, SUCI, 5G-GUTI, GUTI, TAI) in their NAS, AP and text forms, and the JSON tree and paths that the OxiRush crates share. no_std."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-utils"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["3gpp", "5g", "lte", "imsi", "supi"]
categories = ["network-programming", "encoding", "no-std"]
readme = "README.md"
# `benches/` is a package of its own, whose files are no benchmark of the crate.
autobenches = false
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
]

[features]
# What holds a text or a list: the SUPI, the SUCI of an IMSI and the SUCI in the form of a
# NAI, TBCD strings and the identity digits as octets. Without it the crate needs no
# allocator: the PLMN, the IMSI, the IMEI and the IMEISV as values, the GUTIs, the S-TMSIs,
# the TAIs, the types of identity, the routing indicator and the protection scheme of a
# SUCI, the grammar of a NAI and the errors.
alloc = []
# The tree of a message, its forms and its paths. A tree is a `tree::Value`, whose objects
# keep their members in the order in which they are written: the crate turns on no
# feature of `serde_json` that orders a `serde_json::Map`, which is as the program has it.
tree = ["alloc", "dep:serde_json", "dep:serde_core"]
# `Serialize` and `Deserialize` for a type through its tree.
serde = ["tree"]
# The realm and the username of a NAI are also checked as internationalized names:
# Unicode normalization form C, and a realm that IDNA takes as it is written. Without it
# they are checked by the grammar of RFC 7542 alone. It brings the Unicode tables of
# `idna` and of `unicode-normalization`, and is `no_std` too.
idna = ["alloc", "dep:idna", "dep:unicode-normalization"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# cargo-fuzz sets `fuzzing`, and docs.rs `docsrs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(docsrs)'] }

[dependencies]
# Its `Number` is that of a tree, and it reads and writes the text of one. 1.0.154 is the
# first that builds on `serde_core` with `alloc` alone. With `float_roundtrip`, a number is
# read as the nearest f64, so that a tree reads back the number that it prints. serde_json
# then reads so every number with a fraction of a program, in about twice the time.
serde_json = { version = "1.0.154", optional = true, default-features = false, features = ["alloc", "float_roundtrip"] }
serde_core = { version = "1.0.220", optional = true, default-features = false, features = ["alloc"] }
idna = { version = "1", optional = true, default-features = false, features = ["alloc", "compiled_data"] }
unicode-normalization = { version = "0.1.13", optional = true, default-features = false }

[dev-dependencies]
# Another self-describing format than JSON, for the tests of `serde`.
serde_norway = "0.9"
hex = "0.4"

[[test]]
name = "identity"
required-features = ["alloc"]

[[test]]
name = "paths"
required-features = ["tree"]

[[test]]
name = "forms"
required-features = ["tree"]

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "readme"
required-features = ["serde"]

[[test]]
name = "value"
required-features = ["tree"]
