[package]
name = "oxirush-utils"
version = "0.1.0"
edition = "2024"
description = "What the OxiRush crates share: 3GPP identities as values (PLMN, IMSI, IMEI, GUTI, TAI) and one JSON tree with paths for every message family"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-utils"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["3gpp", "5g", "lte", "plmn", "imsi"]
categories = ["network-programming", "encoding", "no-std"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[features]
# The tree of a message as a `serde_json::Value`, its forms and its paths. It turns on
# `serde_json/preserve_order` for the whole build, as cargo unifies features: the members
# of every `serde_json::Map` of a program that depends on this feature keep the order in
# which they were written.
tree = ["dep:serde_json"]
# `Serialize` and `Deserialize` for a type through its tree.
serde = ["tree", "dep:serde_core"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# cargo-fuzz sets `fuzzing`, and docs.rs `docsrs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(docsrs)'] }

[dependencies]
# 1.0.154 is the first whose `preserve_order` needs `alloc` alone.
serde_json = { version = "1.0.154", optional = true, default-features = false, features = ["alloc", "preserve_order"] }
serde_core = { version = "1.0.220", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
# Another self-describing format than JSON, for the tests of `serde`.
serde_yaml = "0.9"
hex = "0.4"

[[test]]
name = "paths"
required-features = ["tree"]

[[test]]
name = "forms"
required-features = ["tree"]

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "readme"
required-features = ["tree"]
