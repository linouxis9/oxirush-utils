# The blocks of the README that use other crates of the family: oxirush-utils with them,
# at the versions that this manifest names. A package of its own, so that the crate
# depends on none of them: nothing here is published. `cargo test` here runs the
# blocks and compares what they print with the README.
[package]
name = "oxirush-utils-family"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dev-dependencies]
oxirush-utils = { path = "..", features = ["serde"] }
oxirush-nas = { version = "0.5", features = ["serde"] }
oxirush-ngap = "0.5"
hex = "0.4"

# Not a member of a workspace that the crate may be in.
[workspace]

# The crates of the family take this one from "..".
[patch.crates-io]
oxirush-utils = { path = ".." }
