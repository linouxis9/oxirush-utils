# The fuzz targets of oxirush-utils, for cargo-fuzz. A package of its own, which
# is not published.
[package]
name = "oxirush-utils-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# What the targets do, which the programs call.
[lib]
name = "targets"

[dependencies]
libfuzzer-sys = "0.4"
oxirush-utils = { path = "..", features = ["tree", "idna"] }
serde_json = "1.0.154"

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "identity"
path = "fuzz_targets/identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false
